name: receipt_cam
version: 1.0.0+1
description: 영수증 사진 전용 앱 - CUT만, OCR 없음, 저장 경로 분리
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  edge_detection: ^1.2.1
  image: ^4.1.3
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  photo_view: ^0.14.0
  fluttertoast: ^8.2.4
  file_picker: ^7.0.2

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # 이미지/아이콘 자산이 필요하면 추가
  # assets:
  #   - assets/
